<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PSC field operations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --paper: #F2EFE6; --ink: #23241F; --ink-soft: #6B6A5F;
    --field-dark: #2C4A3E; --field: #4E7A63; --field-light: #A9C4B2;
    --clay: #B5602E; --line: #DAD4C2; --card: #FBFAF4;
    --green-status: #3D7A4E; --green-bg: #E4EFE3;
    --amber-status: #A6741B; --amber-bg: #F5EAD3;
    --red-status: #B23A2E; --red-bg: #F6E1DC;
    --radius: 10px;
  }
  :root:not([data-theme="light"]){
    @media (prefers-color-scheme: dark){
      --paper: #191B16; --ink: #E9E6DB; --ink-soft: #9C9A8C;
      --field-dark: #A9C4B2; --field: #7FA88E; --field-light: #3E5B4C;
      --clay: #E1935F; --line: #35362C; --card: #212319;
      --green-status: #8FC49A; --green-bg: #223326;
      --amber-status: #E0B25C; --amber-bg: #362C18;
      --red-status: #E38B7E; --red-bg: #3A241F;
    }
  }
  :root[data-theme="dark"]{
    --paper: #191B16; --ink: #E9E6DB; --ink-soft: #9C9A8C;
    --field-dark: #A9C4B2; --field: #7FA88E; --field-light: #3E5B4C;
    --clay: #E1935F; --line: #35362C; --card: #212319;
    --green-status: #8FC49A; --green-bg: #223326;
    --amber-status: #E0B25C; --amber-bg: #362C18;
    --red-status: #E38B7E; --red-bg: #3A241F;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--paper); color: var(--ink);
    font-family: 'IBM Plex Sans Thai', sans-serif;
    line-height: 1.5; max-width: 480px; margin: 0 auto; padding-bottom: 40px;
  }

  .browser-bar{
    background: var(--card); border-bottom: 1px solid var(--line);
    padding: 8px 14px; font-size: 12px; color: var(--ink-soft);
    display:flex; align-items:center; gap:6px;
  }
  .browser-bar .dot{ width:6px; height:6px; border-radius:50%; background:var(--field); }

  header.app-head{ padding: 16px 16px 0; }
  .head-row{ display:flex; justify-content:space-between; align-items:baseline; }
  .eyebrow{ font-size: 12px; color: var(--ink-soft); }
  .updated{
    font-size: 11px; color: var(--field); background: var(--green-bg);
    padding: 3px 9px; border-radius: 999px;
  }
  h1{
    font-family: 'Noto Serif Thai', serif; font-weight: 700; font-size: 22px;
    margin: 6px 0 12px; color: var(--field-dark);
  }

  /* top-level tabs */
  .top-tabs{
    display:flex; background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 3px; margin: 0 16px 16px;
  }
  .top-tab{
    flex:1; text-align:center; padding: 9px 0; font-size: 13.5px;
    border-radius: 8px; color: var(--ink-soft); cursor:pointer;
  }
  .top-tab.active{ background: var(--field-dark); color: var(--paper); font-weight: 600; }

  main{ padding: 0 16px; }
  .view{ display:none; }
  .view.active{ display:block; }

  h2.section-title{
    font-family:'Noto Serif Thai', serif; font-size:15px; font-weight:600;
    color: var(--field-dark); margin: 20px 2px 10px;
    padding-bottom:6px; border-bottom:1px solid var(--line);
  }

  .hidden{ display:none !important; }

  footer.note{
    padding: 20px 16px 4px; font-size: 11.5px; color: var(--ink-soft);
    border-top: 1px solid var(--line); margin-top: 22px;
  }

  /* ===== TAB 1: ราคา ===== */
  .summary{
    margin: 0 0 14px; display:grid; grid-template-columns: repeat(3, 1fr);
    gap: 1px; background: var(--line); border: 1px solid var(--line);
    border-radius: var(--radius); overflow: hidden;
  }
  .summary .stat{ background: var(--card); padding: 12px 8px; text-align: center; }
  .summary .stat .num{ font-family: 'Noto Serif Thai', serif; font-weight: 700; font-size: 19px; }
  .summary .stat .lbl{ font-size: 11px; color: var(--ink-soft); margin-top: 2px; }

  .filter-row{ display:flex; gap:7px; overflow-x:auto; padding: 0 0 12px; scrollbar-width: none; }
  .filter-row::-webkit-scrollbar{ display:none; }
  .chip{
    flex: 0 0 auto; padding: 6px 13px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--card); font-size: 12.5px; color: var(--ink-soft); cursor: pointer;
  }
  .chip.active{ background: var(--field-dark); border-color: var(--field-dark); color: var(--paper); }

  .vendor-card{
    border: 1px solid var(--line); border-radius: var(--radius); background: var(--card);
    margin-bottom: 9px; overflow: hidden;
  }
  .vendor-head{ display:flex; align-items: center; justify-content: space-between; padding: 12px 13px; cursor: pointer; }
  .vendor-name{ font-weight: 600; font-size: 15px; }
  .vendor-stock{ font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .vendor-stock.none{ color: var(--red-status); }
  .price-block{ display:flex; align-items:baseline; gap:4px; flex:0 0 auto; margin-left:10px; }
  .price-num{ font-family: 'Noto Serif Thai', serif; font-weight: 700; font-size: 19px; }
  .price-unit{ font-size: 11.5px; color: var(--ink-soft); }
  .chevron{ width: 17px; height: 17px; margin-left: 8px; flex:0 0 auto; transition: transform 0.2s; color: var(--ink-soft); }
  .vendor-card.open .chevron{ transform: rotate(180deg); }
  .freight-panel{ max-height: 0; overflow: hidden; transition: max-height 0.25s ease; border-top: 1px solid transparent; }
  .vendor-card.open .freight-panel{ border-top: 1px solid var(--line); }
  .freight-inner{ padding: 11px 13px 13px; }
  .freight-row{ display:flex; justify-content:space-between; gap: 10px; font-size: 13px; padding: 6px 0; border-bottom: 1px dashed var(--line); }
  .freight-row:last-child{ border-bottom:none; }
  .freight-truck{ color: var(--ink-soft); font-size: 11.5px; display:block; }
  .freight-price{ color: var(--clay); font-weight: 600; white-space: nowrap; }
  .no-freight{ font-size: 12.5px; color: var(--ink-soft); font-style: italic; padding: 11px 13px; }

  /* ===== TAB 2: รอส่งมอบ ===== */
  .sub-toggle{ display:flex; gap:8px; margin: 0 0 14px; border-bottom: 1px solid var(--line); }
  .sub-tab{ padding: 8px 4px 10px; font-size: 14px; color: var(--ink-soft); border-bottom: 2px solid transparent; cursor:pointer; }
  .sub-tab.active{ color: var(--field-dark); font-weight:600; border-bottom-color: var(--field-dark); }

  .date-group-title{
    font-family:'Noto Serif Thai', serif; font-size: 14px; font-weight:600; color: var(--field-dark);
    margin: 18px 2px 8px; display:flex; justify-content:space-between; align-items:center;
  }
  .date-group-title .count{ font-family:'IBM Plex Sans Thai', sans-serif; font-weight:400; font-size:12px; color: var(--ink-soft); }

  .item-card{ border:1px solid var(--line); border-radius: var(--radius); background: var(--card); margin-bottom: 9px; padding: 12px 13px; }
  .item-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .crop-name{ font-weight:600; font-size:15px; }
  .status-pill{ font-size: 11.5px; padding: 3px 10px; border-radius: 999px; white-space:nowrap; font-weight:600; }
  .status-pill.green{ color:var(--green-status); background:var(--green-bg); }
  .status-pill.amber{ color:var(--amber-status); background:var(--amber-bg); }
  .status-pill.red{ color:var(--red-status); background:var(--red-bg); }
  .item-badges{ display:flex; flex-wrap:wrap; gap:6px; margin: 6px 0 8px; }
  .badge{ font-size: 11.5px; padding: 3px 9px; border-radius: 6px; background: var(--field-light); color: var(--field-dark); }
  .badge.transport{ background: transparent; border: 1px solid var(--line); color: var(--ink-soft); }
  .item-meta{ display:grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; font-size: 13px; }
  .meta-lbl{ color: var(--ink-soft); font-size:11.5px; }
  .meta-val{ font-weight:500; margin-top:1px; }
  .meta-val.qty{ color: var(--clay); font-weight:600; }

  .hist-card{ border:1px solid var(--line); border-radius: var(--radius); background: var(--card); margin-bottom: 9px; padding: 12px 13px; }
  .hist-top{ display:flex; justify-content:space-between; align-items:baseline; }
  .hist-crop{ font-weight:600; font-size:15px; }
  .hist-farm{ font-size:12.5px; color:var(--ink-soft); margin-top:1px; }
  .yield-pill{ font-size:11.5px; font-weight:600; padding:3px 9px; border-radius:999px; }
  .hist-meta{ display:grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; font-size:13px; margin-top:9px; }
  .hist-note{ margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); font-size: 12px; color: var(--ink-soft); }
  .hist-note b{ color: var(--ink); }

  /* ===== TAB 3: สต็อก ===== */
  .item-tabs{ display:flex; gap:7px; overflow-x:auto; padding: 0 0 14px; scrollbar-width:none; }
  .item-tabs::-webkit-scrollbar{ display:none; }
  .item-tab{ flex:0 0 auto; padding: 8px 15px; border-radius: 999px; border:1px solid var(--line); background: var(--card); font-size: 13px; color: var(--ink-soft); cursor:pointer; }
  .item-tab.active{ background: var(--field-dark); border-color: var(--field-dark); color: var(--paper); font-weight:600; }

  .stock-card{ border:1px solid var(--line); border-radius: var(--radius); background: var(--card); padding: 14px 15px; margin-bottom: 12px; }
  .stock-top{ display:flex; justify-content:space-between; align-items:flex-start; }
  .stock-name{ font-weight:600; font-size:16px; }
  .stock-asof{ font-size:11px; color:var(--ink-soft); margin-top:2px; }
  .runout-pill{ font-size:11.5px; font-weight:600; padding:4px 11px; border-radius:999px; white-space:nowrap; }
  .runout-pill.green{ color:var(--green-status); background:var(--green-bg); }
  .runout-pill.amber{ color:var(--amber-status); background:var(--amber-bg); }
  .runout-pill.red{ color:var(--red-status); background:var(--red-bg); }
  .stock-num-row{ display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin: 12px 0 4px; }
  .stock-num-row .lbl{ font-size:11.5px; color:var(--ink-soft); }
  .stock-num-row .num{ font-family:'Noto Serif Thai', serif; font-weight:700; font-size:20px; margin-top:2px; }
  .stock-num-row .num.demand{ color: var(--clay); }
  .chart-wrap{ margin-top: 12px; height: 190px; }
  .forecast-note{ margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); font-size: 12.5px; color: var(--ink-soft); }
  .forecast-note b{ color: var(--ink); }

  table.demand-table{ width:100%; border-collapse:collapse; font-size:12.5px; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; }
  table.demand-table th, table.demand-table td{ padding: 7px 6px; text-align:center; border-bottom:1px solid var(--line); }
  table.demand-table th{ color:var(--ink-soft); font-weight:600; font-size:11px; }
  table.demand-table td.date-col{ text-align:left; color:var(--ink-soft); }
  table.demand-table tr:last-child td{ border-bottom:none; }
  table.demand-table td.neg{ color: var(--red-status); font-weight:600; }

  .source-list{ font-size: 11.5px; color: var(--ink-soft); margin: 10px 2px 0; line-height:1.7; }
<style>:root{--paper:#f8fafb;--ink:#1f2933;--ink-soft:#66737d;--field-dark:#315a49;--field:#5f8b76;--field-light:#e8f0ec;--clay:#b86b3c;--line:#dce5e1;--card:#fff;--green-status:#286044;--green-bg:#e7f3eb;--amber-status:#9a6715;--amber-bg:#fff4d6;--red-status:#a7473e;--red-bg:#fde9e7}@media(prefers-color-scheme:dark){:root{--paper:#171b19;--ink:#edf3ef;--ink-soft:#aebbb4;--field-dark:#a8c9b5;--field:#78a88c;--field-light:#26382f;--clay:#f0a06c;--line:#3a4942;--card:#222a26;--green-status:#9bd2ad;--green-bg:#294234;--amber-status:#f0c875;--amber-bg:#493b21;--red-status:#f0a49b;--red-bg:#4a2d2a}}body{background:var(--paper)}.vendor-card,.item-card,.hist-card,.stock-card,.summary .stat,.top-tabs,.freight-panel{background:var(--card)}</style></style>

<style id="price-reference-theme">
body{background:#f8fafb;color:#1f2933}.browser-bar{background:#eef3f0;color:#66737d}.app-head,.top-tabs,main{background:#f8fafb}.app-head{border-color:#dce5e1}.eyebrow,.updated,.price-unit,.vendor-stock,.lbl{color:#66737d}.top-tabs{border-color:#dce5e1}.top-tab{color:#66737d}.top-tab.active{background:#b7d5c5;color:#18221c}.summary .stat,.vendor-card,.freight-card,.filter-chip{background:#fff;border-color:#dce5e1;color:#1f2933}.summary .stat .num,.price-num{color:#b85f49}.filter-chip.active{background:#315a49;border-color:#315a49;color:#fff}.section-title{color:#1f2933}.freight-panel{background:#fff;border-color:#dce5e1}.freight-row{border-color:#dce5e1;color:#66737d}.freight-title{color:#1f2933}.empty-state{color:#66737d}
</style>
</head>
<body>

<div class="browser-bar"><span class="dot"></span> pscdb.onrender.com</div>

<header class="app-head">
  <div class="head-row">
    <span class="eyebrow">PSC field operations</span>
    <span class="updated" id="updatedLabel">อัปเดตแล้ว 13:42:27</span>
  </div>
  <h1 id="pageTitle">รายการรอส่งมอบ</h1>
</header>

<div class="top-tabs">
  <div class="top-tab" data-tab="pending">รอส่งมอบ</div>
  <div class="top-tab" data-tab="price">ราคา</div>
  <div class="top-tab" data-tab="stock">สต็อก</div>
</div>

<main>

  <!-- ============ TAB 1: รอส่งมอบ ============ -->
  <div class="view" id="view-pending">
    <div class="sub-toggle">
      <div class="sub-tab active" data-target="pendingList">รอรับของ</div>
      <div class="sub-tab" data-target="historyList">ประวัติรับเข้า</div>
    </div>
    <div class="filter-row" id="cropFilterRow"></div>
    <div id="pendingList"></div>
    <div id="historyList" class="hidden"></div>
  </div>

  <!-- ============ TAB 2: ราคา ============ -->
  <div class="view" id="view-price">
    <div class="summary" id="priceSummary"></div>
    <div class="filter-row" id="routeFilterRow"></div>
    <h2 class="section-title">ผู้ค้ากะหล่ำ</h2>
    <div id="vendorList"></div>
    <h2 class="section-title">รถขนส่งเพิ่มเติม (ยังไม่มีของวันนี้)</h2>
    <div id="freightOnlyList"></div>
  </div>

  <!-- ============ TAB 3: สต็อก ============ -->
  <div class="view" id="view-stock">
    <div class="item-tabs" id="itemTabs"></div>
    <div id="stockCards"></div>
    <h2 class="section-title">ตารางยอดใช้รวมรายวัน (ตามชนิดที่เลือก)</h2>
    <div id="demandTableWrap"></div>
    <div class="source-list" id="sourceList"></div>
  </div>

</main>

<footer class="note" id="footerNote">
  แตะแท็บด้านบนเพื่อสลับระหว่างรายการรอส่งมอบ ราคารับซื้อ และสต็อก/พยากรณ์
</footer>

<script>
(function(){
const $=id=>document.getElementById(id),esc=v=>String(v??'–').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),n=v=>{const m=String(v??'').replace(/,/g,'').match(/-?\d+(?:\.\d+)?/);return m?Number(m[0]):null},fmt=v=>{if(!v)return '–';const d=new Date(v+'T00:00:00');return Number.isNaN(d.getTime())?esc(v):d.toLocaleDateString('th-TH',{day:'2-digit',month:'2-digit',year:'numeric'})};
async function get(p){const r=await fetch(p+'?t='+Date.now(),{cache:'no-store',credentials: 'same-origin'});if(!r.ok)throw Error(p);return r.json()}
const titles={pending:'รายการรอส่งมอบ',price:'ราคากะหล่ำวันนี้',stock:'สต็อกและพยากรณ์วัตถุดิบ'};
function renderPending(d){const a=(d.schedules||[]).slice(0,5);const v=$('pendingList');v.innerHTML='';const groups={};a.forEach(x=>(groups[x.targetDate||'ไม่ระบุ']??=[]).push(x));Object.keys(groups).sort().forEach(day=>{v.innerHTML+=`<div class="date-group-title"><span>กำหนดรับ ${fmt(day)}</span><span class="count">${groups[day].length} รายการ</span></div>`;groups[day].forEach(x=>v.innerHTML+=`<div class="item-card"><div class="item-top"><div class="crop-name">${esc(x.detail||'ไม่ระบุสินค้า')}</div><div class="status-pill green">${esc(x.status||'รอดำเนินการ')}</div></div><div class="item-badges"><span class="badge">${esc(x.seller||'ยังไม่ระบุ')}</span><span class="badge transport">${esc(x.transporter||'ยังไม่ระบุ')}</span></div><div class="item-meta"><div><div class="meta-lbl">วันที่กำหนดรับ</div><div class="meta-val">${fmt(x.targetDate)}</div></div><div><div class="meta-lbl">ปริมาณ</div><div class="meta-val qty">${Number(x.qtyKg||0).toLocaleString('th-TH')} กก.</div></div></div></div>`)})}
function renderHistory(d){const a=d.intake_records||[];$('historyList').innerHTML='<div class="date-group-title"><span>ประวัติรับเข้าวัตถุดิบ</span></div>'+a.map(x=>{const up=n(x.weightUp),got=n(x.weight),pct=up!=null&&got!=null?(up-got)/up*100:null,loss=up!=null&&got!=null?`${(up-got).toLocaleString('th-TH')} kg (${pct.toFixed(2)}%)`:x.transitLoss||'–',cl=pct>10?'loss-red':pct>5?'loss-orange':'';return `<div class="hist-card"><div class="hist-top"><div><div class="hist-crop">${esc(x.item)}</div><div class="hist-farm">${esc(x.supplier)}</div></div><span class="yield-pill status-pill ${x.yield==null?'amber':'green'}">${x.yield==null?'รอบันทึกผล':'Yield '+Number(x.yield).toFixed(2)+'%'}</span></div><div class="hist-meta"><div><div class="meta-lbl">วันขึ้นของ</div><div class="meta-val">${fmt(x.dispatchDate)}</div></div><div><div class="meta-lbl">วันรับเข้า</div><div class="meta-val">${fmt(x.intakeDate||x.date)}</div></div><div><div class="meta-lbl">น้ำหนักต้นทาง</div><div class="meta-val">${esc(x.weightUp)}</div></div><div><div class="meta-lbl">น้ำหนักรับเข้าจริง</div><div class="meta-val">${esc(x.weight)}</div></div><div><div class="meta-lbl">น้ำหนักหาย</div><div class="meta-val ${cl}">${esc(loss)}</div></div><div><div class="meta-lbl">แหล่งขึ้นสินค้า</div><div class="meta-val">${esc(x.location)}</div></div></div><div class="hist-note"><b>คุณภาพ/หมายเหตุ:</b> ${esc(x.condition||x.size)}</div></div>`}).join('')}
function renderPrice(d){const all=d.prices||[],ps=all.map(s=>Number(s.pricePerKg||0)).filter(v=>v>0),hi=ps.length?Math.max(...ps):null,lo=ps.length?Math.min(...ps):null,av=ps.length?ps.reduce((a,b)=>a+b,0)/ps.length:null;$('priceSummary').innerHTML=`<div class="stat"><div class="num" style="color:var(--red-status)">${hi==null?'–':hi.toFixed(1)}</div><div class="lbl">สูงสุด (บาท/กก.)</div></div><div class="stat"><div class="num" style="color:var(--field)">${lo==null?'–':lo.toFixed(1)}</div><div class="lbl">ต่ำสุด (บาท/กก.)</div></div><div class="stat"><div class="num">${av==null?'–':av.toFixed(2)}</div><div class="lbl">เฉลี่ย (บาท/กก.)</div></div>`;const locations=[...new Set(all.map(s=>s.location).filter(Boolean))],row=$('routeFilterRow');row.innerHTML='';const filters=[{label:'ทั้งหมด',value:''},...locations.map(x=>({label:x,value:x}))];filters.forEach((f,i)=>{const el=document.createElement('div');el.className='filter-chip '+(i?'':'active');el.textContent=f.label;el.dataset.value=f.value;el.onclick=()=>{row.querySelectorAll('.filter-chip').forEach(x=>x.classList.remove('active'));el.classList.add('active');draw(f.value)};row.appendChild(el)});const draw=location=>{const sup=all.filter(s=>!location||s.location===location),list=$('vendorList');list.innerHTML='';const priced=sup.filter(s=>Number(s.pricePerKg||0)>0),freightOnly=sup.filter(s=>Number(s.pricePerKg||0)<=0&&(Number(s.truck4Cost||0)>0||Number(s.truck6Cost||0)>0));priced.forEach(s=>{const card=document.createElement('div');card.className='vendor-card';const details=[s.location&&`สถานที่/แหล่งรับซื้อ: ${s.location}`,s.note].filter(Boolean);card.innerHTML=`<div class="vendor-head"><div><div class="vendor-name">${esc(s.seller||'ไม่ระบุผู้ขาย')}</div><div class="vendor-stock">${esc(s.note||'ไม่มีของ')}</div></div><div><span class="price-num">${esc(s.pricePerKg)}</span><span class="price-unit">บาท/กก.</span><span class="chevron">⌄</span></div></div><div class="freight-panel"><div class="freight-inner">${(details.length?details:['ยังไม่มีข้อมูล']).map(x=>`<div class="freight-row">${esc(x)}</div>`).join('')}</div></div>`;card.querySelector('.vendor-head').onclick=()=>{card.classList.toggle('open');const q=card.querySelector('.freight-panel');q.style.maxHeight=card.classList.contains('open')?q.scrollHeight+'px':'0'};list.appendChild(card)});const namedCoverage=new Set();freightOnly.forEach(s=>{const named=String(s.seller||s.transporter||'').trim();if(!named)return;const location=s.location||'ไม่ระบุสถานที่';if(Number(s.truck4Cost||0)>0)namedCoverage.add(location+'|4 ล้อ|'+Number(s.truck4Cost));if(Number(s.truck6Cost||0)>0)namedCoverage.add(location+'|6 ล้อ|'+Number(s.truck6Cost))});const freightGroups={};freightOnly.filter(s=>String(s.seller||s.transporter||'').trim()).forEach(s=>{const owner=s.seller||s.transporter||'ไม่ระบุผู้ขนส่ง';const named=String(s.seller||s.transporter||'').trim();const add=(kind,cost)=>{if(!cost)return;const location=s.location||'ไม่ระบุสถานที่';if(!named&&namedCoverage.has(location+'|'+kind+'|'+cost))return;const key=owner+'|'+kind+'|'+cost;if(!freightGroups[key])freightGroups[key]={owner,kind,cost,locations:[]};if(!freightGroups[key].locations.includes(location))freightGroups[key].locations.push(location)};add('4 ล้อ',Number(s.truck4Cost||0));add('6 ล้อ',Number(s.truck6Cost||0))});$('freightOnlyList').innerHTML=Object.values(freightGroups).length?Object.values(freightGroups).map(g=>`<div class="freight-card"><div class="freight-title">${esc(g.owner)}</div><div class="freight-row">${esc(g.locations.join(' + '))} ${esc(g.kind)} ${Number(g.cost).toLocaleString('th-TH')} บาท</div></div>`).join(''):'<div class="empty-state">ไม่มีข้อมูลค่าขนส่ง</div>'};draw('')}let chart;function renderStock(d){const items={Cabbage:'กะหล่ำปลี',Carrot:'แครอทสวย',Onion_AFT:'หอม AFT (หอมปอก)',Onion_Chinese:'หอมจีน'},demand=d.demandByDate||{},days=Object.keys(demand).sort();const key=Object.keys(items)[0];if(!days.length){$('itemTabs').innerHTML='';$('stockCards').innerHTML='<div class="stock-card"><div class="stock-name">รอข้อมูล Customer PO จาก WDB</div><div class="forecast-note">ยังไม่แสดงตัวเลข forecast จนกว่าจะได้รับยอดใช้รายวันจากฐานข้อมูล</div></div>';$('demandTableWrap').innerHTML='';return;}$('itemTabs').innerHTML=Object.entries(items).map(([k,v],i)=>`<div class="item-tab ${i?'':'active'}" data-key="${k}">${v}</div>`).join('');const draw=k=>{document.querySelectorAll('.item-tab').forEach(t=>t.classList.toggle('active',t.dataset.key===k));const x=d.Items?.[k]||{},bal=Number(x.StockKg||0),asOfKey=String(d.AsOfDate||'').slice(0,10),intake=d.intakeByDate||{},daily=days.map(day=>Number(demand[day]?.[k]||0)),totalDemand=daily.reduce((a,b)=>a+b,0),series=[],rows=[];let running=bal;daily.forEach((qty,i)=>{const day=days[i],past=asOfKey&&day<asOfKey,received=Number(intake[day]?.[k]||intake[day]?.[k]?.qtyKg||0);if(!past){running=running+received-qty;series.push(running)}else{series.push(null)}const balanceCell=past?'–':Math.round(running).toLocaleString('th-TH');rows.push(`<tr><td class="date-col">${fmt(day)}</td><td>${qty?qty.toLocaleString('th-TH'):'–'}</td><td>${received?received.toLocaleString('th-TH'):'–'}</td><td class="${!past&&running<0?'neg':''}">${balanceCell}</td></tr>`)});const hasPo=totalDemand>0;$('stockCards').innerHTML=`<div class="stock-card"><div class="stock-top"><div><div class="stock-name">${items[k]}</div><div class="stock-asof">ตรวจนับล่าสุด ${esc(d.AsOfDate||'-')}</div></div><div class="runout-pill ${series.some(v=>v<0)?'red':'green'}">${hasPo?(series.some(v=>v<0)?'คาดว่าสต็อกไม่พอ':'เพียงพอตาม PO'):'รอข้อมูล PO'}</div></div><div class="stock-num-row"><div><div class="lbl">สต็อกปัจจุบัน</div><div class="num">${bal.toLocaleString('th-TH')} กก.</div></div><div><div class="lbl">ยอดใช้ตาม PO</div><div class="num demand">${totalDemand.toLocaleString('th-TH')} กก.</div></div></div><div class="chart-wrap"><canvas id="balanceChart"></canvas></div><div class="forecast-note"><b>ยอดใช้อ้างอิงจาก:</b> ${hasPo?(d.demandSource||'Customer PO daily breakdowns'):'ยังไม่มีข้อมูล Customer PO ใน WDB'}<br><b>การคำนวณ:</b> ยอดคงเหลือ = สต็อก ณ วันที่ตรวจนับ + รับเข้า - ยอดส่งมอบ (ไม่หักยอดวันที่ผ่านมา)</div></div>`;if(chart)chart.destroy();chart=new Chart($('balanceChart'),{type:'line',data:{labels:days.map(fmt),datasets:[{data:series,borderColor:'var(--field-dark)',backgroundColor:'rgba(49,90,73,.12)',fill:true,tension:.25,pointRadius:2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#66737d'}},y:{ticks:{color:'#66737d'}}}}});$('demandTableWrap').innerHTML='<table class="demand-table"><thead><tr><th>วันที่</th><th>ยอดใช้ PO</th><th>รับเข้า</th><th>คงเหลือสะสม</th></tr></thead><tbody>'+rows.join('')+'</tbody></table>'};draw(key);document.querySelectorAll('.item-tab').forEach(t=>t.onclick=()=>draw(t.dataset.key))}
const emptyWdb={ok:false,stock:[],schedules:[],prices:[],demandByDate:{}};async function getLiveWdb(){for(let attempt=0;attempt<3;attempt++){try{const d=await get('/api/live-sheets');if(d&&((d.prices||[]).length||(d.stock||[]).length||(d.schedules||[]).length||(d.demandByDate&&Object.keys(d.demandByDate).length)))return d}catch(e){if(attempt===2)console.error(e)}if(attempt<2)await new Promise(r=>setTimeout(r,800*(attempt+1)))}return emptyWdb}Promise.allSettled([getLiveWdb(),get('/api/team-status')]).then(([wdbResult,teamResult])=>{const wdb=wdbResult.status==='fulfilled'?wdbResult.value:emptyWdb;const t=teamResult.status==='fulfilled'?teamResult.value:{active_operations:[],history_logs:[]};renderPending(wdb);renderHistory(t);renderPrice(wdb);renderStock({AsOfDate:wdb.timestamp,demandByDate:wdb.demandByDate||{},intakeByDate:wdb.intakeByDate||{},demandSource:wdb.demandSource,Items:Object.fromEntries((wdb.stock||[]).map(x=>[x.code,{Name:x.name,StockKg:Number(x.actualQtyKg)||0}]))});$('updatedLabel').textContent=wdb.ok===false?'ข้อมูล WDB กำลังเชื่อมต่อใหม่':'อัปเดตแล้ว '+new Date().toLocaleTimeString('th-TH')}).catch(e=>{console.error(e);$('updatedLabel').textContent='โหลดข้อมูลไม่สำเร็จ'});
let target='pending';function switchTab(t){target=t;document.querySelectorAll('.top-tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===t));document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id==='view-'+t));$('pageTitle').textContent=titles[t];}document.querySelectorAll('.top-tab').forEach(t=>t.onclick=()=>switchTab(t.dataset.tab));document.querySelectorAll('.sub-tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.sub-tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');$('pendingList').classList.toggle('hidden',t.dataset.target!=='pendingList');$('historyList').classList.toggle('hidden',t.dataset.target!=='historyList')});switchTab('pending');
})();</script>
