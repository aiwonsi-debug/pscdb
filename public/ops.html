<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PSC Field Operations</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/ops.css?v=20260918">
<style>
.status-note{font-size:.78rem;color:#64748b;margin:8px 0 14px}.error{color:#b91c1c;background:#fef2f2;border:1px solid #fecaca;padding:10px;border-radius:10px}.empty{color:#64748b;padding:16px 0}.data-card{margin-bottom:12px}.error button{cursor:pointer}
</style>
</head>
<body>
<div class="container">
<header class="app-header"><div><div class="brand-title">PSC field operations</div><div class="brand-subtitle" id="subtitle">รายการรอส่งมอบ</div></div><div class="header-timestamp status-fresh"><span id="updated">กำลังโหลดข้อมูล...</span></div></header>
<nav class="main-nav-bar" role="tablist"><button class="nav-tab-btn active" data-tab="delivery">รอส่งมอบ</button><button class="nav-tab-btn" data-tab="price">ราคา</button><button class="nav-tab-btn" data-tab="stock">สต็อก</button></nav>
<div class="tabs-carousel" id="tabs">
<main class="app-section" id="delivery"><div class="section-headline">ตารางติดตามขึ้นของสวน</div><div id="ops"><div class="status-note">กำลังโหลดข้อมูล...</div></div><div class="section-headline" style="margin-top:20px">ประวัติรับเข้าวัตถุดิบ</div><div id="intake"><div class="status-note">กำลังโหลดข้อมูล...</div></div></main>
<main class="app-section" id="price"><div class="section-headline">ราคาวัตถุดิบ & ค่าขนส่ง</div><div id="prices"><div class="status-note">กำลังโหลดข้อมูล...</div></div></main>
<main class="app-section" id="stock"><div class="section-headline">สต็อกตรวจนับจริงล่าสุด</div><div id="stocks"><div class="status-note">กำลังโหลดข้อมูล...</div></div></main>
</div><div id="load-error" class="error" style="display:none;margin-top:12px"><span id="load-error-text">โหลดข้อมูลไม่สำเร็จ</span> <button id="retry" type="button" style="margin-left:8px;padding:6px 10px;border-radius:8px;border:1px solid #b91c1c;background:#fff;color:#b91c1c">ลองโหลดใหม่</button></div><footer>บจก.ไพศาลเจริญ (1988)</footer></div>
<script>
'use strict';
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=v=>Number(v||0).toLocaleString('th-TH');
function card(title,sub,body){return `<div class="flat-card data-card"><div class="card-header-row"><div><div class="card-title-text">${esc(title)}</div><div class="card-subtitle-text">${esc(sub||'')}</div></div></div>${body}</div>`}
function setTab(tab){document.querySelectorAll('.nav-tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.querySelectorAll('.app-section').forEach(s=>s.style.display=s.id===tab?'block':'none');$('subtitle').textContent=tab==='stock'?'สต็อกตรวจนับจริงล่าสุด':tab==='price'?'ราคาวัตถุดิบ & ค่าขนส่ง':'รายการรอส่งมอบ'}
document.querySelectorAll('.nav-tab-btn').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));setTab('delivery');
async function get(path){const r=await fetch(path+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(path+' '+r.status);return r.json()}
function renderOps(d){const a=(d.live_schedules||[]).slice(0,5),product=x=>String(x.weight||'').includes('พริกหวาน')?'พริกหวานเขียว':String(x.weight||'').includes('หอมแดง')?'หอมแดง':'กะหล่ำปลี',qty=x=>{const n=Number(String(x.status||'').replace(/[^0-9.]/g,''));return Number.isFinite(n)&&n>0?n:'-'};$('ops').innerHTML=a.length?a.map(x=>card(product(x),x.origin||'',`<div class="grid-2x2"><div class="grid-cell"><span class="lbl">วันที่ขึ้นของ</span><span class="val">${esc(x.supplier||'-')}</span></div><div class="grid-cell"><span class="lbl">กำหนดส่ง</span><span class="val">${esc(x.supplier||'-')}</span></div><div class="grid-cell"><span class="lbl">ปริมาณ</span><span class="val">${fmt(qty(x))} กก.</span></div><div class="grid-cell"><span class="lbl">สถานะ</span><span class="val">รอดำเนินการ</span></div></div><div class="card-forecast">${esc(x.detail||x.truck||'')}</div>`)).join(''):'<div class="empty">ไม่มีรายการรอส่งมอบ</div>'}
function renderIntake(d){const reports=d.field_reports||[],states=d.cards_state||{};const a=[...(d.intake_records||[]),...(d.history_logs||[])];const kg=v=>{const m=String(v??'').match(/[0-9][0-9,]*(?:\.[0-9]+)?/);if(!m)return null;const n=Number(m[0].replace(/,/g,''));return Number.isFinite(n)&&n>0?n:null};$('intake').innerHTML=a.length?a.map(x=>{const fr=reports.find(r=>r.date===x.date||r.cardId===x.cardId)||{},cs=states[x.cardId]||{};const weightUp=x.loadedWeight||x.weightUp||fr.loadedWeight||cs.loadedWeight||'-';const weight=x.intakeWeight||fr.intakeWeight||cs.intakeWeight||(weightUp==='-'?(x.weight||fr.weight||'-'):'-');const receivedKg=kg(weight),upKg=kg(weightUp),lossKg=receivedKg&&upKg?upKg-receivedKg:null,lossPct=lossKg!=null?(lossKg/upKg*100):null;const yieldVal=x.yield??fr.receivedYield??cs.receivedYield;const size=x.size||fr.receivedSize||cs.receivedSize||'-';const condition=x.condition||fr.receivedCondition||cs.receivedCondition||'-';const place=x.location||fr.location||cs.loadedLocation||'';return card(x.item||'วัตถุดิบ','',`<div class="grid-2x2"><div class="grid-cell"><span class="lbl">วันที่รับเข้า</span><span class="val">${esc(x.date||'-')}</span></div><div class="grid-cell"><span class="lbl">น้ำหนักขึ้นรถ</span><span class="val">${esc(weightUp)}</span></div><div class="grid-cell"><span class="lbl">น้ำหนักรับเข้า</span><span class="val">${esc(weight)}</span></div><div class="grid-cell"><span class="lbl">ส่วนต่างน้ำหนัก</span><span class="val">${lossKg==null?'-':lossKg.toLocaleString('th-TH',{maximumFractionDigits:2})+' kg ('+lossPct.toFixed(2)+'%)'}</span></div><div class="grid-cell"><span class="lbl">Yield</span><span class="val">${yieldVal==null?'-':Number(yieldVal).toFixed(2)+'%'}</span></div><div class="grid-cell"><span class="lbl">ขนาด</span><span class="val">${esc(size)}</span></div></div><div class="card-forecast"><b>สภาพ:</b> ${esc(condition)}${place?`<br><b>สถานที่:</b> ${esc(place)}`:''}</div>`)}).join(''):'<div class="empty">ไม่มีประวัติรับเข้า</div>'}
function renderStock(d){const names={Cabbage:'กะหล่ำปลี',Onion_AFT:'หอม AFT',Onion_Chinese:'หอมจีน',Carrot:'แครอทสวย'};$('stocks').innerHTML=Object.entries(d.Items||{}).map(([k,v])=>card(names[k]||v.Name||k,'ข้อมูลจาก Daily report',`<div class="metric-row"><span class="big-metric">${fmt(v.StockKg)}</span><span class="metric-unit">กก.</span></div>`)).join('')||'<div class="empty">ไม่มีข้อมูลสต็อก</div>'; $('updated').textContent='อัปเดต '+(d.AsOfDate||'-')}
function renderPrices(d){const h=d.PriceHistory||[];const latest=h[h.length-1]||{};const rows=(latest.Suppliers||[]).map(x=>card(x.name||'ผู้จำหน่าย','',`<div class="grid-2x2"><div class="grid-cell"><span class="lbl">ราคา</span><span class="val">${esc(x.price||'-')}</span></div><div class="grid-cell"><span class="lbl">ค่าขนส่ง</span><span class="val">${esc((x.rates||'-').replace(/\n/g,' · '))}</span></div></div><div class="card-forecast">${esc(x.notes||'')}</div>`)).join('');$('prices').innerHTML=rows||'<div class="empty">ไม่มีข้อมูลราคา</div>'}
async function loadAll(){const err=$('load-error'),msg=$('load-error-text');if(err)err.style.display='none';$('updated').textContent='กำลังโหลดข้อมูล...';const jobs=[get('/api/team-status').then(d=>{renderOps(d);renderIntake(d);}),get('/api/stock').then(d=>renderStock(d)),get('/api/prices').then(d=>renderPrices(d))];const results=await Promise.allSettled(jobs);const failed=results.filter(x=>x.status==='rejected');if(failed.length){msg.textContent='โหลดข้อมูลบางส่วนไม่สำเร็จ กรุณาลองใหม่';err.style.display='block';console.error('[PSC] API load failed',failed.map(x=>x.reason));}else{$('updated').textContent='อัปเดตแล้ว '+new Date().toLocaleTimeString('th-TH');}}
$('retry').onclick=loadAll;loadAll();
</script>
</body></html>
