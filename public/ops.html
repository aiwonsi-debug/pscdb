<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PSC Field Operations</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/ops.css?v=20260918">
<style>
.status-note{font-size:.78rem;color:#64748b;margin:8px 0 14px}.error{color:#b91c1c;background:#fef2f2;border:1px solid #fecaca;padding:10px;border-radius:10px}.empty{color:#64748b;padding:16px 0}.data-card{margin-bottom:12px}
</style>
</head>
<body>
<div class="container">
<header class="app-header"><div><div class="brand-title">PSC field operations</div><div class="brand-subtitle" id="subtitle">รายการรอส่งมอบ</div></div><div class="header-timestamp status-fresh"><span id="updated">กำลังโหลดข้อมูล...</span></div></header>
<nav class="main-nav-bar" role="tablist"><button class="nav-tab-btn active" data-tab="delivery">รอส่งมอบ</button><button class="nav-tab-btn" data-tab="price">ราคา</button><button class="nav-tab-btn" data-tab="stock">สต็อก</button></nav>
<div class="tabs-carousel" id="tabs">
<main class="app-section" id="delivery"><div class="section-headline">ตารางติดตามขึ้นของสวน</div><div id="ops"><div class="status-note">กำลังโหลดข้อมูล...</div></div><div class="section-headline" style="margin-top:20px">ประวัติรับเข้าวัตถุดิบ</div><div id="intake"><div class="status-note">กำลังโหลดข้อมูล...</div></div></main>
<main class="app-section" id="price"><div class="section-headline">ราคาวัตถุดิบ & ค่าขนส่ง</div><div id="prices"><div class="status-note">กำลังโหลดข้อมูล...</div></div></main>
<main class="app-section" id="stock"><div class="section-headline">สต็อกตรวจนับจริงล่าสุด</div><div id="stocks"><div class="status-note">กำลังโหลดข้อมูล...</div></div></main>
</div><footer>บจก.ไพศาลเจริญ (1988)</footer></div>
<script>
'use strict';
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=v=>Number(v||0).toLocaleString('th-TH');
function card(title,sub,body){return `<div class="flat-card data-card"><div class="card-header-row"><div><div class="card-title-text">${esc(title)}</div><div class="card-subtitle-text">${esc(sub||'')}</div></div></div>${body}</div>`}
function setTab(tab){document.querySelectorAll('.nav-tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.querySelectorAll('.app-section').forEach(s=>s.style.display=s.id===tab?'block':'none');$('subtitle').textContent=tab==='stock'?'สต็อกตรวจนับจริงล่าสุด':tab==='price'?'ราคาวัตถุดิบ & ค่าขนส่ง':'รายการรอส่งมอบ'}
document.querySelectorAll('.nav-tab-btn').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));setTab('delivery');
async function get(path){const r=await fetch(path+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(path+' '+r.status);return r.json()}
function renderOps(d){const a=[...(d.active_operations||[]),...(d.live_schedules||[])];$('ops').innerHTML=a.length?a.map(x=>card(x.product||'วัตถุดิบ',x.farm||x.customer||'',`<div class="grid-2x2"><div class="grid-cell"><span class="lbl">วันที่ขึ้นของ</span><span class="val">${esc(x.loading_date||x.date||'-')}</span></div><div class="grid-cell"><span class="lbl">กำหนดส่ง</span><span class="val">${esc(x.delivery_date||x.date||'-')}</span></div><div class="grid-cell"><span class="lbl">ปริมาณ</span><span class="val">${fmt(x.qty_kg??x.weight)} กก.</span></div><div class="grid-cell"><span class="lbl">สถานะ</span><span class="val">${esc(x.status||'-')}</span></div></div>`)).join(''):'<div class="empty">ไม่มีรายการรอส่งมอบ</div>'}
function renderIntake(d){const a=[...(d.intake_records||[]),...(d.history_logs||[])];$('intake').innerHTML=a.length?a.map(x=>card(x.item||'วัตถุดิบ','',`<div class="grid-2x2"><div class="grid-cell"><span class="lbl">วันที่รับเข้า</span><span class="val">${esc(x.date||'-')}</span></div><div class="grid-cell"><span class="lbl">รับจริง</span><span class="val">${esc(x.weight||x.weightUp||'-')}</span></div><div class="grid-cell"><span class="lbl">Yield</span><span class="val">${x.yield==null?'-':Number(x.yield).toFixed(2)+'%'}</span></div></div><div class="card-forecast">${esc(x.condition||x.sample||x.location||'')}</div>`)).join(''):'<div class="empty">ไม่มีประวัติรับเข้า</div>'})();
</script>
</body></html>
